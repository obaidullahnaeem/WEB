<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Inline Style </title>
    <style>
    div {
      color: pink;
      background-color: yellow;
    }

    p {
      color: red;
      font-size: 20.9px;
    }
  </style>

</head>

<body>
    <!-- we aply inlinne in the body -->
    <div style="color: white; background-color: black;">
        ...
    </div>
    <h1     style="color: white; background-color: black;">
            Inline Style        
        </h1>
    <p 
        style="color: red; font-size: 15.9px;"
        >This is a paragraph with inline styling.</p>
</body>
</html>
