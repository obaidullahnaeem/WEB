<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Style</title>
    <style>
        div {
            color: pink;
            background-color: yellow; }
        
        h1 {
            color: red;
            font-size: 20.9px; 
            padding: 15px;}

        p:nth-of-type(2) {
            color: red;
            background-color: yellow;
            font-size: 20.9px;
            padding: 15px;
            border: 2px solid red;
        }
        
        p:nth-of-type(3) {
            color: yellow;
            background-color: red;
            font-size: 20.9px;
            padding: 15px;
            border: 2px solid yellow;
        }
    </style>
</head>
<body>
    <h2>First Heading</h2>
    <p>This is the first small paragraph. It contains a few sentences of text.</p>

    <h2>Second Heading</h2>
    <p>This is the second small paragraph. It also has a short amount of content.</p>

    <h3>Third Heading</h3>
    <p>This is the third small paragraph. It also has a short amount of content.</p>


</body>
</html>
